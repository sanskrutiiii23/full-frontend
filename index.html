<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CITRIX — CampusOS Intelligence · One Campus. One System.</title>
  <meta name="description" content="CITRIX is the intelligent campus operating system for Chilika Institute of Technology, unifying academic scheduling, venue bookings, examinations, disruption management and AI assistance.">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23B8F36B'><path d='M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5'/></svg>">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            citrix: {
              bg: '#F7F8F6',
              white: '#FFFFFF',
              text: '#101110',
              secondary: '#777D78',
              border: '#E5E8E3',
              dark: '#080A09',
              darkSurface: '#121614',
              darkCard: '#161B18',
              darkBorder: '#1F2420',
              darkMuted: '#9AA19C',
              accent: '#B8F36B',
              accentHover: '#A6E854',
              accentDark: '#7FB33C',
              navy: '#0B132B',
              navyDark: '#070D1F',
              teal: '#007A64',
              emerald: '#10B981'
            }
          },
          fontFamily: {
            sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif'],
            mono: ['JetBrains Mono', 'ui-monospace', 'monospace']
          },
          boxShadow: {
            'subtle': '0 1px 3px rgba(0,0,0,0.03), 0 1px 2px rgba(0,0,0,0.02)',
            'premium': '0 20px 40px -15px rgba(0,0,0,0.06), 0 0 1px 1px rgba(0,0,0,0.04)',
            'elevation': '0 30px 60px -15px rgba(0,0,0,0.12), 0 16px 32px -10px rgba(0,0,0,0.08)',
            'floating': '0 35px 80px -20px rgba(0,0,0,0.2), 0 20px 40px -15px rgba(0,0,0,0.12)',
            'glow-green': '0 0 35px -5px rgba(184, 243, 107, 0.45)',
            'glow-sm': '0 0 15px -2px rgba(184, 243, 107, 0.5)'
          }
        }
      }
    };
  </script>

  <!-- Google Fonts: Inter & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #F7F8F6;
      color: #101110;
      margin: 0;
      padding: 0;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }
    
    /* Custom scrollbars */
    ::-webkit-scrollbar {
      width: 7px;
      height: 7px;
    }
    ::-webkit-scrollbar-track {
      background: #F7F8F6;
    }
    ::-webkit-scrollbar-thumb {
      background: #D1D5DB;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #9CA3AF;
    }

    /* Keyframe Animations */
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.8; transform: scale(1); }
      50% { opacity: 0.3; transform: scale(1.3); }
    }
    .animate-radar-pulse {
      animation: pulseGlow 2.4s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }

    @keyframes floatSubtle {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-6px); }
    }
    .animate-float {
      animation: floatSubtle 5s ease-in-out infinite;
    }

    @keyframes dashMove {
      to { stroke-dashoffset: -40; }
    }
    .animate-dash {
      stroke-dasharray: 6 6;
      animation: dashMove 2.5s linear infinite;
    }

    /* Smooth transitions */
    .transition-editorial {
      transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* ── Intro animation GPU hints ───────────────────────── */
    #intro-panel-top,
    #intro-panel-bottom {
      will-change: transform;
    }
    #intro-line1,
    #intro-line2 {
      will-change: clip-path;
    }

    /* Reduced motion: skip intro entirely */
    @media (prefers-reduced-motion: reduce) {
      #citrix-intro { display: none !important; }
    }
  </style>
</head>
<body class="bg-[#F7F8F6] text-[#101110] min-h-screen antialiased selection:bg-[#B8F36B] selection:text-[#101110]">
  <div id="app" class="min-h-screen flex flex-col">
    <!-- Application will mount here -->
    <div class="h-screen w-screen flex flex-col items-center justify-center bg-[#F7F8F6] text-center p-6">
      <div class="w-12 h-12 rounded-xl bg-[#080A09] border border-[#1F2420] flex items-center justify-center font-black text-[#B8F36B] text-2xl mb-4 shadow-xl">
        C
      </div>
      <h2 class="text-xl font-bold text-[#101110] tracking-tight mb-2">CITRIX — CampusOS Intelligence</h2>
      <p class="text-xs text-[#777D78] max-w-sm font-mono uppercase tracking-wider">One Campus. One System.</p>
    </div>
  </div>

  <!-- Main ES Module Entry Point -->
  <script type="module" src="./src/main.js"></script>
</body>
</html>
